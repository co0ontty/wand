name: Beta NPM Publish

# 每次 push 到 master，基于最新正式 tag 发布一个 npm beta 版本。
# 版本形态：<tag-version>-beta.g<short-sha>，例如 1.43.2-beta.ga1b2c3d。
# 正式版与 Beta 版都走同一条 npm 全局安装链路；区别仅是 dist-tag：
#   stable → npm @latest（纯 tag）
#   beta   → npm @beta（tag + commit 尾标）

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: beta-branch
  cancel-in-progress: true

jobs:
  publish-beta:
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Checkout pinned Render binaries
        # 与 stable 一样只检出 npm 包需要的产物，保留后面的严格校验。
        run: git submodule update --init -- render-bin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Compute beta version
        id: version
        run: |
          set -euo pipefail
          TAG="$(git tag --sort=-v:refname --list 'v*' | head -1)"
          if [ -z "$TAG" ]; then
            echo "No v* tag found" >&2
            exit 1
          fi
          BASE_VERSION="${TAG#v}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${BASE_VERSION}-beta.g${SHORT_SHA}"
          echo "base_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package versions
        run: |
          node -e "
          const fs = require('fs');
          const version = '${{ steps.version.outputs.version }}';
          for (const file of ['package.json', 'package-lock.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            if (pkg.packages && pkg.packages['']) pkg.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          "

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build (stamp beta channel)
        run: npm run build
        env:
          # 让 scripts/stamp-build-info.js 写 channel=beta、commit=master HEAD。
          WAND_BUILD_CHANNEL: beta

      # 发版必须硬失败：npm run build 里的 stage 是 best-effort（没拉子模块的开发机
      # 不该因此构建失败），但 CI 不能把「没内嵌产物」的包发出去。
      # --all 是必须的：包要覆盖 manifest 里的所有平台，而不是只覆盖 runner 自己的平台。
      - name: Verify render binaries are packaged
        run: node scripts/stage-render-binaries.js --all --strict --check

      - name: Publish beta to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          WAND_PUBLISH_VERSION: ${{ steps.version.outputs.version }}
          WAND_BUILD_CHANNEL: beta
        run: node scripts/publish-npm.js "${{ steps.version.outputs.version }}" beta
