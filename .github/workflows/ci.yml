name: CI

# 日常只验证 npm 交付：三套 TypeScript、声明生成、Web bundle 预算与固定 Render 产物。
# 原生客户端和 Rust 源码在各自发布/源码工作流验证，不在服务端 CI 重复构建。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned Render binaries
        run: git submodule update --init -- render-bin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # build 先生成 Web 资产，再编译服务端与声明文件，同时执行 bundle 预算门禁。
      - name: Build npm package
        run: npm run build

      # build 已检查服务端；这里只补齐另外两套 TS，避免再次生成同一批 Web 资产。
      - name: Typecheck browser and React
        run: |
          npx --no-install tsc --noEmit -p tsconfig.browser.json
          npx --no-install tsc --noEmit -p tsconfig.react.json

      - name: Verify packaged Render binaries
        run: node scripts/stage-render-binaries.js --all --strict --check
