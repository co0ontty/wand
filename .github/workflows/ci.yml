name: CI

# 类型检查、构建契约与业务单测的质量门。
# 界面操作矩阵属于专项验收，显式手动触发，不阻塞每次业务/架构改动。
#
# 为什么固定跑在 macOS runner：`npm test` 是全量的跨端契约套件，
# 其中「生成品牌资源与 Android launcher 同步」用例要读 iOS/macOS 的 AppIcon PNG，
# 而这些图标由 `generate-icons.swift`（CoreGraphics，仅 macOS）生成。Linux runner
# 上该用例必然失败，只有 macOS 才能跑完整套件。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_regression:
        description: "额外运行浏览器专项回归（不作为普通 push 的全局门禁）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24", "26"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git submodule update --init -- render-bin
      - run: npm ci --prefer-offline
      - run: npm run check
      - name: Runtime, storage and installer contracts
        run: node --test --import tsx tests/deployment-lock.test.ts tests/update-node-bootstrap.test.ts tests/web-update-recovery.test.ts tests/update-deployment-lock.test.ts tests/update-compatibility.test.ts tests/storage-security-migrations.test.ts tests/storage-session-options.test.ts tests/core-harness.test.ts tests/pi-output-file.test.ts tests/build-budget-reporting.test.ts tests/bundle-budget.test.ts
      - run: npm run build

  verify:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 跨端源码契约用例会读 android/ios/macos 源码，render-bin 提供固定
          # Render 发布产物。压力契约使用下面从固定 render 源码编译的 release
          # 二进制；dist/native 的现有发布产物仍由独立兼容用例验证。
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # CLI resource/isolation tests need a real CLI install on PATH. Wand's pinned
      # SDK dependency is deliberately not a fallback for a missing CLI.
      # Keep this install outside the checkout and pin its independently tested version.
      - name: Install independent Pi CLI for contract tests
        run: |
          set -euo pipefail
          CLI_ROOT="$RUNNER_TEMP/wand-ci-pi"
          npm install --prefix "$CLI_ROOT" --no-audit --no-fund --save-exact @earendil-works/pi-coding-agent@1.2.0
          echo "$CLI_ROOT/node_modules/.bin" >> "$GITHUB_PATH"
          "$CLI_ROOT/node_modules/.bin/pi" --version

      # 内嵌品牌资产（browser-extension 图标、wand-logo、生成的 swift 脚本）是
      # 构建产物，未入库；干净检出必须先同步，否则品牌一致性用例直接失败。
      - name: Sync generated brand assets
        run: npm run sync:brand-assets

      # AppIcon PNG 同为生成物（.gitignore 忽略），由各平台的 generate-icons.swift
      # 产出，品牌用例会校验其尺寸与不透明度。
      - name: Generate native app icons
        run: |
          set -euo pipefail
          swift ios/scripts/generate-icons.swift ios/Wand/Assets.xcassets/AppIcon.appiconset
          swift macos/scripts/generate-icons.swift macos/Wand/Assets.xcassets/AppIcon.appiconset

      # 三套 tsconfig 的 tsc + 前端 bundle + bundle 预算门禁。
      - name: Typecheck and bundle
        run: npm run check

      - name: Cache pinned Render build
        uses: actions/cache@v4
        with:
          path: render/target
          key: render-ci-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('render/Cargo.lock', 'render/Cargo.toml', 'render/crates/**') }}

      - name: Build pinned Render for protocol tests
        run: |
          set -euo pipefail
          git -C render diff --exit-code
          cargo build --locked --release --manifest-path render/Cargo.toml -p wand-renderd
          test -x render/target/release/wand-render
          # Stage unchanged release artifacts for the distinct package compatibility tests.
          node scripts/stage-render-binaries.js --all --strict

      # 保留业务、协议、存储和运行生命周期断言；不因点击坐标/浏览器启动抖动
      # 阻止与界面无关的需求。完整 UI 矩阵仍保留在显式专项入口。
      - name: Unit and contract tests
        run: node scripts/check-node-version.js && node scripts/run-ci-tests.js --suite=unit
        env:
          WAND_RENDER_BIN: ${{ github.workspace }}/render/target/release/wand-render

      - name: Optional browser regression
        if: github.event_name == 'workflow_dispatch' && inputs.ui_regression
        run: node scripts/run-ci-tests.js --suite=ui
        env:
          WAND_RENDER_BIN: ${{ github.workspace }}/render/target/release/wand-render

      # Loopback-only synthetic employee fixtures, not installed-service captures.
      # Preserve the actual DOM/pointer evidence when a hosted browser gate fails.
      - name: Upload employee browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: employee-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/employee-profile-browser/
          if-no-files-found: ignore
          retention-days: 7
