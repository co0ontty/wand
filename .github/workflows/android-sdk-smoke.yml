# 临时：仅用于手工验证 android-release.yml 的 SDK setup 修复（上游下线旧 `tools`
# 包后 release 一直在 setup 步骤失败）。验证完即删除，不参与任何发布流程。
name: Android SDK Smoke (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Checkout Android submodule
        run: |
          set -euo pipefail
          git submodule sync -- android
          git submodule update --init --force -- android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Report installed SDK packages
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/"*/bin/sdkmanager --list_installed || true

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PAPP_VERSION_NAME="4.68.0+smoke.00000000"

      - name: Report APK
        run: ls -la android/app/build/outputs/apk/debug/
