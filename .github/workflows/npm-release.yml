name: NPM Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-npm:
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout pinned Render binaries
        # npm 构建只消费发布产物；原生客户端和 Rust 源码各自独立构建。
        run: git submodule update --init -- render-bin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync package versions with tag
        run: |
          node -e "
          const fs = require('fs');
          const version = '${{ steps.version.outputs.version }}';
          for (const file of ['package.json', 'package-lock.json']) {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            if (pkg.packages && pkg.packages['']) pkg.packages[''].version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          }
          "

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build
        run: npm run build

      # 显式把关：npm run build 里的 stage 步骤是 best-effort（开发机没拉子模块也不该构建失败），
      # 但发版必须硬失败。这里用 --strict 重跑一次，缺产物就拦住发布。
      - name: Verify render binaries are packaged
        # --all：npm 包要内嵌 manifest 里的所有平台，而不是只内嵌 runner 自己的平台。
        run: node scripts/stage-render-binaries.js --all --strict --check

      # Stable 与 beta 发布共用 npm-publish concurrency group，避免同时写同一个
      # packument。npm publish 返回成功后仍要反查 registry，因为并发写曾导致版本被
      # tombstone：不能重发同版本，但 npm view 又读不到它。
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm.js "${{ steps.version.outputs.version }}" latest
